name: Build and Test

on:
  push:
    tags-ignore:
      - '*'
    branches:
      - '*'

jobs:
  buid-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: docker compose up
        run: make docker-up

      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '25'
          java-package: jdk
          architecture: x64

      - uses: DeLaGuardo/setup-clojure@master
        with:
          cli: latest
          cljstyle: '0.17.642'
          clj-kondo: '2026.08.04'

      - name: Show versions
        run: |
          java -version
          clojure --version
          cljstyle version
          clj-kondo --version

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: clj-cache-${{ hashFiles('**/deps.edn') }}
          restore-keys: |
            clj-cache-

      - name: Lint
        run: make lint

      - name: Test
        env:
          AWS_REGION: ap-northeast-1
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
        run: make test
